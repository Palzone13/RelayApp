<!DOCTYPE html>
<html lang="en">
<head>
<script>try{if(localStorage.getItem('relay-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PalTube — Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #eef1f8;
  --white: #ffffff;
  --pill: #9a9ea8;
  --pill-dark: #82858f;
  --card: #90939c;
  --card-dark: #7c7f88;
  --row: #f3f4f7;
  --line: #e2e4ea;
  --text: #1f2330;
  --muted: #666a76;
  --grad: linear-gradient(90deg,#ef4444 0%,#f97316 100%);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:inherit;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  min-height:100%;
}
a{color:inherit;text-decoration:none;}

.topbar{
  height:6px;
  width:100%;
  background:var(--grad);
  position:sticky;top:0;z-index:30;
  padding-top:env(safe-area-inset-top,0px);
  background-clip:padding-box;
}

.wrap{max-width:980px;margin:36px auto 60px;padding:0 20px;}

.panel{
  background:var(--white);
  border-radius:22px;
  box-shadow:0 14px 40px rgba(30,41,59,.10);
  padding:30px 32px 34px;
}

.nav-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:26px;}
.search{
  flex:1 1 220px;
  min-width:150px;
  background:var(--row);
  border:1px solid var(--line);
  border-radius:999px;
  padding:12px 44px 12px 18px;
  font-size:13.5px;
  color:var(--muted);
  position:relative;
  display:flex;align-items:center;
}
.search input{border:none;background:none;outline:none;font-size:13.5px;color:var(--text);width:100%;font-family:inherit;}
.search svg{position:absolute;right:16px;width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;}

.pill-nav{display:flex;flex-wrap:wrap;gap:8px;}
.pill{
  background:var(--pill);
  color:#fff;
  border:none;
  border-radius:12px;
  padding:11px 18px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  white-space:nowrap;
  transition:filter .15s, transform .1s;
}
.pill:hover{filter:brightness(.94);}
.pill.active{background:var(--grad);}

.title-pill{
  display:block;
  width:max-content;
  margin:0 auto 26px;
  background:var(--pill);
  color:#fff;
  font-weight:600;
  font-size:13.5px;
  border-radius:12px;
  padding:12px 30px;
  text-align:center;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}
@media (max-width:760px){ .grid{grid-template-columns:repeat(2,1fr);} }
@media (max-width:460px){ .grid{grid-template-columns:1fr;} }

.vcard{
  background:var(--card);
  border-radius:14px;
  aspect-ratio:9/14;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding-top:38%;
  overflow:hidden;
  cursor:pointer;
}
.vcard:hover{background:var(--card-dark);}
.play{
  width:38px;height:38px;border-radius:50%;
  background:#14151a;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:14px;
}
.play svg{width:14px;height:14px;fill:#fff;}
.vcard .label{color:#f2f3f5;font-size:12px;font-weight:500;padding:0 10px;text-align:center;}
.vcard .who{position:absolute;bottom:12px;left:12px;right:12px;color:#fff;font-size:11.5px;opacity:.9;}

.pcard{
  background:var(--card);
  border-radius:14px;
  padding:16px;
  color:#fff;
}
.pcard .head{display:flex;gap:10px;align-items:center;margin-bottom:10px;}
.pcard .avatar{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none;}
.pcard .name{font-size:13px;font-weight:600;}
.pcard .meta{font-size:11px;opacity:.8;}
.pcard .body{font-size:13px;line-height:1.5;opacity:.95;}
.pcard .actions{display:flex;gap:8px;margin-top:14px;}
.pcard .actions button{background:rgba(255,255,255,.18);border:none;border-radius:999px;color:#fff;font-size:11.5px;font-weight:600;padding:6px 12px;cursor:pointer;display:flex;align-items:center;gap:5px;}
.pcard .actions button.on{background:#fff;color:var(--text);}

.row-list{display:flex;flex-direction:column;gap:10px;}
.row{
  background:var(--row);
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px 16px;
  display:flex;align-items:center;gap:12px;
}
.row .avatar{width:40px;height:40px;border-radius:12px;background:var(--card);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;}
.row.round .avatar{border-radius:50%;}
.row .info{min-width:0;flex:1;}
.row .info .t1{font-weight:600;font-size:13.5px;}
.row .info .t2{color:var(--muted);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row .side{flex:none;display:flex;align-items:center;gap:8px;}
.btn{border:none;border-radius:999px;padding:8px 16px;font-size:12.5px;font-weight:600;cursor:pointer;}
.btn-grad{background:var(--grad);color:#fff;}
.btn-flat{background:var(--pill);color:#fff;}
.btn-outline{background:none;border:1px solid var(--line);color:var(--text);}

.section-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 10px;}
.section-title:first-child{margin-top:0;}

.poll{background:var(--row);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px;}
.poll .q{font-weight:700;font-size:14px;margin-bottom:14px;}
.popt{position:relative;border-radius:10px;overflow:hidden;background:#e6e8ee;padding:10px 14px;margin-bottom:8px;cursor:pointer;}
.popt .fill{position:absolute;inset:0;background:var(--grad);opacity:.85;width:0;transition:width .4s;}
.popt.voted .fill{opacity:1;}
.popt .r{position:relative;display:flex;justify-content:space-between;font-size:13px;font-weight:600;}
.popt.voted .r{color:#fff;}

.profile-top{display:flex;gap:18px;align-items:center;margin-bottom:24px;flex-wrap:wrap;}
.profile-top .avatar{width:72px;height:72px;border-radius:20px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;flex:none;}
.profile-top h2{margin:0;font-size:19px;}
.profile-top .handle{color:var(--muted);font-size:13px;margin-top:2px;}
.stats{display:flex;gap:26px;margin-top:12px;}
.stats b{display:block;font-size:16px;}
.stats span{color:var(--muted);font-size:11.5px;}

.toggle{width:38px;height:22px;border-radius:999px;background:var(--pill);position:relative;cursor:pointer;flex:none;}
.toggle.on{background:var(--grad);}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;}
.toggle.on::after{transform:translateX(16px);}

.note{background:#eef2ff;border:1px solid #dbe2fb;color:#3546a3;border-radius:14px;padding:14px 16px;font-size:12.5px;margin-bottom:22px;}
.error{display:none;background:#fdecef;border:1px solid #f6c4cd;color:#b4233c;border-radius:12px;padding:10px 14px;font-size:12.5px;margin-bottom:14px;}
[data-theme="dark"] .error{background:#3a1a22;border-color:#5c2733;color:#ff9db0;}
.composer2{background:var(--row);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:20px;}
.composer2 textarea{width:100%;background:none;border:none;color:var(--text);resize:none;font-family:inherit;font-size:14px;min-height:40px;outline:none;}
.composer2 textarea::placeholder{color:var(--muted);}
.composer2 .crow{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:10px;border-top:1px solid var(--line);}
.composer2 .cicons{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12px;}
.composer2 .cicons label{cursor:pointer;}
.composer2 #img-preview{max-height:120px;border-radius:10px;margin-top:8px;display:none;}
.feed-post{background:var(--row);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;}
.feed-post .phead{display:flex;gap:10px;align-items:flex-start;}
.feed-post .phead a{display:flex;gap:10px;align-items:flex-start;text-decoration:none;color:inherit;}
.feed-post .pname{font-weight:600;font-size:13.5px;}
.feed-post .pmeta{color:var(--muted);font-size:12px;}
.feed-post .pbody{margin:10px 0 4px;font-size:13.8px;white-space:pre-wrap;}
.feed-post .pmedia{margin-top:10px;max-width:100%;border-radius:10px;display:block;}
.feed-post .pactions{display:flex;gap:6px;margin-top:12px;}
.rx-btn2{display:flex;align-items:center;gap:6px;background:var(--white);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:12.5px;font-weight:600;}
.rx-btn2.on-like{color:#16a34a;border-color:#bbf7d0;background:#f0fdf4;}
.rx-btn2.on-dislike{color:#dc2626;border-color:#fecaca;background:#fef2f2;}
[data-theme="dark"] .rx-btn2{background:var(--white);}
[data-theme="dark"] .rx-btn2.on-like{background:#0f2a1a;border-color:#1c4d2e;}
[data-theme="dark"] .rx-btn2.on-dislike{background:#3a1414;border-color:#5c2222;}
.comments-box{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:none;}
.comments-box.open{display:block;}
.comment-line{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start;}
.comment-line .bubble2{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:7px 12px;font-size:12.8px;flex:1;}
.comment-line .cname{font-weight:600;margin-right:6px;}
.comment-add{display:flex;gap:8px;margin-top:8px;}
.comment-add input{flex:1;background:var(--white);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:12.8px;color:var(--text);font-family:inherit;outline:none;}
.empty-state{
  text-align:center;
  padding:60px 20px;
  color:var(--muted);
}
.empty-state p{font-size:15px;font-weight:600;color:var(--text);margin:0 0 6px;}
.empty-state span{font-size:12.5px;}


:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1117; --white:#181b25; --pill:#4b5061; --pill-dark:#3d4252;
  --card:#343948; --card-dark:#2b3040; --row:#212533; --line:#2f3444;
  --text:#eceef4; --muted:#9aa1b3;
}
[data-theme="dark"] .note{background:#1c2240;border-color:#2b3566;color:#b9c4f5;}
[data-theme="dark"] .popt{background:#2a2f3f;}
[data-theme="dark"] .panel{box-shadow:0 14px 40px rgba(0,0,0,.45);}

.brand-mark{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;color:var(--text);white-space:nowrap;padding:0 4px 0 0;font-family:'Inter',sans-serif;}
.brand-mark .play{width:22px;height:22px;border-radius:7px;background:var(--grad);display:flex;align-items:center;justify-content:center;flex:none;}
.brand-mark .play svg{width:10px;height:10px;fill:#fff;}
</style>
</head>
<body>
<script src="api.js"></script>
<script>
api('/auth/me').catch(function(){ window.location.href = 'login.html'; });
</script>
<div class="topbar"></div>
<div class="wrap">
  <div class="panel">
    <div class="nav-row">
      <div class="brand-mark"><div class="play"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></div>PalTube</div>
      <label class="search">
        <input type="text" placeholder="Search PalTube">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </label>
      <a class="pill active" href="index.html">Feed</a>
      <a class="pill" href="reels.html">Shorts</a>
      <a class="pill" href="friends.html">Friends</a>
      <a class="pill" href="dms.html">DMs</a>
      <a class="pill" href="groups.html">Groups</a>
      <a class="pill" href="polls.html">Polls</a>
      <a class="pill" href="profile.html">Profile</a>
      <a class="pill" href="settings.html">Settings</a>
    </div>
    <div class="title-pill">your feed</div>

    <div class="composer2">
      <textarea id="post-body" placeholder="Share something, Pal…" rows="2"></textarea>
      <img id="img-preview">
      <div id="post-error" class="error"></div>
      <div class="crow">
        <div class="cicons">
          <label title="Image">🖼<input type="file" id="post-image" accept="image/*" style="display:none;"></label>
          <span id="clear-image" style="display:none;cursor:pointer;">✕ remove image</span>
        </div>
        <button class="btn btn-amber" id="post-btn">Post</button>
      </div>
    </div>

    <div id="feed-content"><div class="empty-state"><p>Loading&hellip;</p></div></div>
  </div>
</div>

<script>
function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, function(c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function timeAgo(iso) {
  var diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return 'now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  return new Date(iso).toLocaleDateString();
}
var me = null;

document.getElementById('post-image').addEventListener('change', function() {
  var f = this.files[0];
  var preview = document.getElementById('img-preview');
  if (!f) { preview.style.display = 'none'; document.getElementById('clear-image').style.display = 'none'; return; }
  preview.src = URL.createObjectURL(f);
  preview.style.display = 'block';
  document.getElementById('clear-image').style.display = 'inline';
});
document.getElementById('clear-image').addEventListener('click', function() {
  document.getElementById('post-image').value = '';
  document.getElementById('img-preview').style.display = 'none';
  this.style.display = 'none';
});

document.getElementById('post-btn').addEventListener('click', async function() {
  var body = document.getElementById('post-body').value.trim();
  var file = document.getElementById('post-image').files[0];
  var errEl = document.getElementById('post-error');
  errEl.style.display = 'none';
  if (!body && !file) { errEl.textContent = 'Write something or add an image.'; errEl.style.display = 'block'; return; }

  var form = new FormData();
  form.append('body', body);
  if (file) form.append('image', file);

  this.disabled = true;
  try {
    var res = await fetch(API_BASE + '/posts', { method: 'POST', credentials: 'include', body: form });
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not post');
    document.getElementById('post-body').value = '';
    document.getElementById('post-image').value = '';
    document.getElementById('img-preview').style.display = 'none';
    document.getElementById('clear-image').style.display = 'none';
    loadFeed();
  } catch (err) {
    errEl.textContent = err.message; errEl.style.display = 'block';
  } finally {
    this.disabled = false;
  }
});

async function loadFeed() {
  var container = document.getElementById('feed-content');
  var posts = (await api('/posts/feed')).posts;

  if (posts.length === 0) {
    container.innerHTML = '<div class="empty-state"><p>No posts yet.</p><span>Posts from people and groups you follow will show up here.</span></div>';
    return;
  }

  container.innerHTML = posts.map(function(p) {
    return '<div class="feed-post" data-post-id="' + p.id + '">' +
      '<div class="phead"><a href="profile.html?user=' + encodeURIComponent(p.username) + '">' +
        avatarHtml(p, 36) +
        '<div><div class="pname">' + escapeHtml(p.display_name) + '</div><div class="pmeta">@' + escapeHtml(p.username) + ' &middot; ' + timeAgo(p.created_at) + '</div></div>' +
      '</a></div>' +
      (p.body ? '<div class="pbody">' + escapeHtml(p.body) + '</div>' : '') +
      (p.media_path ? '<img class="pmedia" src="' + API_BASE + p.media_path + '">' : '') +
      '<div class="pactions">' +
        '<button class="rx-btn2 react-btn' + (p.my_reaction === 'like' ? ' on-like' : '') + '" data-type="like">👍 <span>' + p.likes + '</span></button>' +
        '<button class="rx-btn2 react-btn' + (p.my_reaction === 'dislike' ? ' on-dislike' : '') + '" data-type="dislike">👎 <span>' + p.dislikes + '</span></button>' +
        '<button class="rx-btn2 comment-toggle">💬 <span>' + p.comment_count + '</span></button>' +
      '</div>' +
      '<div class="comments-box"><div class="comment-list"></div>' +
        '<div class="comment-add"><input class="comment-input" placeholder="Write a comment…"><button class="btn btn-flat comment-send">Send</button></div>' +
      '</div>' +
    '</div>';
  }).join('');

  container.querySelectorAll('.react-btn').forEach(function(btn) {
    btn.addEventListener('click', async function() {
      var postId = btn.closest('[data-post-id]').dataset.postId;
      try {
        await api('/posts/' + postId + '/react', { method: 'POST', body: { type: btn.dataset.type } });
        loadFeed();
      } catch (err) { alert(err.message); }
    });
  });

  container.querySelectorAll('.comment-toggle').forEach(function(btn) {
    btn.addEventListener('click', async function() {
      var card = btn.closest('[data-post-id]');
      var box = card.querySelector('.comments-box');
      var wasOpen = box.classList.contains('open');
      box.classList.toggle('open');
      if (!wasOpen) await loadComments(card.dataset.postId, box.querySelector('.comment-list'));
    });
  });

  container.querySelectorAll('.comment-send').forEach(function(btn) {
    btn.addEventListener('click', async function() {
      var card = btn.closest('[data-post-id]');
      var input = card.querySelector('.comment-input');
      var text = input.value.trim();
      if (!text) return;
      input.value = '';
      await api('/posts/' + card.dataset.postId + '/comments', { method: 'POST', body: { body: text } });
      await loadComments(card.dataset.postId, card.querySelector('.comment-list'));
      loadFeed();
    });
  });
}

async function loadComments(postId, listEl) {
  listEl.innerHTML = '<div style="font-size:12px;color:var(--muted);">Loading…</div>';
  var comments = (await api('/posts/' + postId + '/comments')).comments;
  listEl.innerHTML = comments.length === 0
    ? '<div style="font-size:12px;color:var(--muted);">No comments yet.</div>'
    : comments.map(function(c) {
        return '<div class="comment-line">' + avatarHtml(c, 26) +
          '<div class="bubble2"><span class="cname">' + escapeHtml(c.display_name) + '</span>' + escapeHtml(c.body) + '</div></div>';
      }).join('');
}

api('/auth/me').then(function(r) { me = r.user; loadFeed(); });
</script>
</body>
</html>
