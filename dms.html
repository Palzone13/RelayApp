<!DOCTYPE html>
<html lang="en">
<head>
<script>try{if(localStorage.getItem('relay-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PalTube — DMs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #eef1f8;
  --white: #ffffff;
  --pill: #9a9ea8;
  --pill-dark: #82858f;
  --card: #90939c;
  --card-dark: #7c7f88;
  --row: #f3f4f7;
  --line: #e2e4ea;
  --text: #1f2330;
  --muted: #666a76;
  --grad: linear-gradient(90deg,#ef4444 0%,#f97316 100%);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:inherit;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  min-height:100%;
}
a{color:inherit;text-decoration:none;}

.topbar{
  height:6px;
  width:100%;
  background:var(--grad);
  position:sticky;top:0;z-index:30;
  padding-top:env(safe-area-inset-top,0px);
  background-clip:padding-box;
}

.wrap{max-width:980px;margin:36px auto 60px;padding:0 20px;}

.panel{
  background:var(--white);
  border-radius:22px;
  box-shadow:0 14px 40px rgba(30,41,59,.10);
  padding:30px 32px 34px;
}

.nav-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:26px;}
.search{
  flex:1 1 220px;
  min-width:150px;
  background:var(--row);
  border:1px solid var(--line);
  border-radius:999px;
  padding:12px 44px 12px 18px;
  font-size:13.5px;
  color:var(--muted);
  position:relative;
  display:flex;align-items:center;
}
.search input{border:none;background:none;outline:none;font-size:13.5px;color:var(--text);width:100%;font-family:inherit;}
.search svg{position:absolute;right:16px;width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;}

.pill-nav{display:flex;flex-wrap:wrap;gap:8px;}
.pill{
  background:var(--pill);
  color:#fff;
  border:none;
  border-radius:12px;
  padding:11px 18px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  white-space:nowrap;
  transition:filter .15s, transform .1s;
}
.pill:hover{filter:brightness(.94);}
.pill.active{background:var(--grad);}

.title-pill{
  display:block;
  width:max-content;
  margin:0 auto 26px;
  background:var(--pill);
  color:#fff;
  font-weight:600;
  font-size:13.5px;
  border-radius:12px;
  padding:12px 30px;
  text-align:center;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}
@media (max-width:760px){ .grid{grid-template-columns:repeat(2,1fr);} }
@media (max-width:460px){ .grid{grid-template-columns:1fr;} }

.vcard{
  background:var(--card);
  border-radius:14px;
  aspect-ratio:9/14;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding-top:38%;
  overflow:hidden;
  cursor:pointer;
}
.vcard:hover{background:var(--card-dark);}
.play{
  width:38px;height:38px;border-radius:50%;
  background:#14151a;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:14px;
}
.play svg{width:14px;height:14px;fill:#fff;}
.vcard .label{color:#f2f3f5;font-size:12px;font-weight:500;padding:0 10px;text-align:center;}
.vcard .who{position:absolute;bottom:12px;left:12px;right:12px;color:#fff;font-size:11.5px;opacity:.9;}

.pcard{
  background:var(--card);
  border-radius:14px;
  padding:16px;
  color:#fff;
}
.pcard .head{display:flex;gap:10px;align-items:center;margin-bottom:10px;}
.pcard .avatar{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none;}
.pcard .name{font-size:13px;font-weight:600;}
.pcard .meta{font-size:11px;opacity:.8;}
.pcard .body{font-size:13px;line-height:1.5;opacity:.95;}
.pcard .actions{display:flex;gap:8px;margin-top:14px;}
.pcard .actions button{background:rgba(255,255,255,.18);border:none;border-radius:999px;color:#fff;font-size:11.5px;font-weight:600;padding:6px 12px;cursor:pointer;display:flex;align-items:center;gap:5px;}
.pcard .actions button.on{background:#fff;color:var(--text);}

.row-list{display:flex;flex-direction:column;gap:10px;}
.row{
  background:var(--row);
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px 16px;
  display:flex;align-items:center;gap:12px;
}
.row .avatar{width:40px;height:40px;border-radius:12px;background:var(--card);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;}
.row.round .avatar{border-radius:50%;}
.row .info{min-width:0;flex:1;}
.row .info .t1{font-weight:600;font-size:13.5px;}
.row .info .t2{color:var(--muted);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row .side{flex:none;display:flex;align-items:center;gap:8px;}
.btn{border:none;border-radius:999px;padding:8px 16px;font-size:12.5px;font-weight:600;cursor:pointer;}
.btn-grad{background:var(--grad);color:#fff;}
.btn-flat{background:var(--pill);color:#fff;}
.btn-outline{background:none;border:1px solid var(--line);color:var(--text);}

.section-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 10px;}
.section-title:first-child{margin-top:0;}

.poll{background:var(--row);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px;}
.poll .q{font-weight:700;font-size:14px;margin-bottom:14px;}
.popt{position:relative;border-radius:10px;overflow:hidden;background:#e6e8ee;padding:10px 14px;margin-bottom:8px;cursor:pointer;}
.popt .fill{position:absolute;inset:0;background:var(--grad);opacity:.85;width:0;transition:width .4s;}
.popt.voted .fill{opacity:1;}
.popt .r{position:relative;display:flex;justify-content:space-between;font-size:13px;font-weight:600;}
.popt.voted .r{color:#fff;}

.profile-top{display:flex;gap:18px;align-items:center;margin-bottom:24px;flex-wrap:wrap;}
.profile-top .avatar{width:72px;height:72px;border-radius:20px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;flex:none;}
.profile-top h2{margin:0;font-size:19px;}
.profile-top .handle{color:var(--muted);font-size:13px;margin-top:2px;}
.stats{display:flex;gap:26px;margin-top:12px;}
.stats b{display:block;font-size:16px;}
.stats span{color:var(--muted);font-size:11.5px;}

.toggle{width:38px;height:22px;border-radius:999px;background:var(--pill);position:relative;cursor:pointer;flex:none;}
.toggle.on{background:var(--grad);}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;}
.toggle.on::after{transform:translateX(16px);}

.note{background:#eef2ff;border:1px solid #dbe2fb;color:#3546a3;border-radius:14px;padding:14px 16px;font-size:12.5px;margin-bottom:22px;}
.error{display:none;background:#fdecef;border:1px solid #f6c4cd;color:#b4233c;border-radius:12px;padding:10px 14px;font-size:12.5px;margin-bottom:14px;}
[data-theme="dark"] .error{background:#3a1a22;border-color:#5c2733;color:#ff9db0;}
.empty-state{
  text-align:center;
  padding:60px 20px;
  color:var(--muted);
}
.empty-state p{font-size:15px;font-weight:600;color:var(--text);margin:0 0 6px;}
.empty-state span{font-size:12.5px;}

.compose-dm{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.compose-dm input{flex:1 1 140px;background:var(--row);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:13.5px;color:var(--text);font-family:inherit;outline:none;}
.compose-dm input:focus{border-color:#8b5cf6;}
.badge{background:var(--grad);color:#fff;border-radius:999px;padding:1px 8px;font-size:10.5px;font-weight:700;margin-left:6px;}
.thread-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.thread-head .back{background:var(--pill);color:#fff;border:none;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer;}
.bubbles{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;max-height:420px;overflow-y:auto;padding:4px;}
.bubble{max-width:70%;padding:9px 14px;border-radius:16px;font-size:13.3px;line-height:1.4;}
.bubble.mine{align-self:flex-end;background:var(--grad);color:#fff;border-bottom-right-radius:4px;}
.bubble.theirs{align-self:flex-start;background:var(--row);border:1px solid var(--line);border-bottom-left-radius:4px;}
.reply-row{display:flex;gap:8px;}
.reply-row input{flex:1;background:var(--row);border:1px solid var(--line);border-radius:999px;padding:12px 16px;font-size:13.5px;color:var(--text);font-family:inherit;outline:none;}
.reply-row input:focus{border-color:#8b5cf6;}


:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1117; --white:#181b25; --pill:#4b5061; --pill-dark:#3d4252;
  --card:#343948; --card-dark:#2b3040; --row:#212533; --line:#2f3444;
  --text:#eceef4; --muted:#9aa1b3;
}
[data-theme="dark"] .note{background:#1c2240;border-color:#2b3566;color:#b9c4f5;}
[data-theme="dark"] .popt{background:#2a2f3f;}
[data-theme="dark"] .panel{box-shadow:0 14px 40px rgba(0,0,0,.45);}

.brand-mark{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;color:var(--text);white-space:nowrap;padding:0 4px 0 0;font-family:'Inter',sans-serif;}
.brand-mark .play{width:22px;height:22px;border-radius:7px;background:var(--grad);display:flex;align-items:center;justify-content:center;flex:none;}
.brand-mark .play svg{width:10px;height:10px;fill:#fff;}
</style>
</head>
<body>
<script src="api.js"></script>
<script>
api('/auth/me').catch(function(){ window.location.href = 'login.html'; });
</script>
<div class="topbar"></div>
<div class="wrap">
  <div class="panel">
    <div class="nav-row">
      <div class="brand-mark"><div class="play"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></div>PalTube</div>
      <label class="search">
        <input type="text" placeholder="Search PalTube">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </label>
      <a class="pill" href="index.html">Feed</a>
      <a class="pill" href="reels.html">Shorts</a>
      <a class="pill" href="friends.html">Friends</a>
      <a class="pill active" href="dms.html">DMs</a>
      <a class="pill" href="groups.html">Groups</a>
      <a class="pill" href="polls.html">Polls</a>
      <a class="pill" href="profile.html">Profile</a>
      <a class="pill" href="settings.html">Settings</a>
    </div>
    <div class="title-pill">direct messages</div>
    <div id="dm-content">
      <div class="empty-state"><p>Loading&hellip;</p></div>
    </div>
  </div>
</div>

<script>
function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, function(c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function initials(name) {
  return (name || '?').split(' ').map(function(w){ return w[0]; }).join('').slice(0, 2).toUpperCase();
}
function timeAgo(iso) {
  var d = new Date(iso), diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return 'now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h';
  return d.toLocaleDateString();
}

var params = new URLSearchParams(window.location.search);
var withUser = params.get('with');
var me = null;

async function render() {
  me = (await api('/auth/me')).user;
  if (withUser) renderThread(withUser);
  else renderList();
}

async function renderList() {
  var container = document.getElementById('dm-content');
  container.innerHTML =
    '<div class="compose-dm">' +
      '<input id="new-username" placeholder="Username to message">' +
      '<input id="new-body" placeholder="Say something">' +
      '<button class="btn btn-grad" id="send-new">Message</button>' +
    '</div>' +
    '<div id="convo-error" class="error" style="display:none;"></div>' +
    '<div id="convo-list"></div>';

  document.getElementById('send-new').addEventListener('click', startNewConversation);

  var convos = (await api('/messages/conversations')).conversations;
  var listEl = document.getElementById('convo-list');
  if (convos.length === 0) {
    listEl.innerHTML = '<div class="empty-state"><p>No conversations yet.</p><span>Message someone by username above.</span></div>';
    return;
  }
  listEl.innerHTML = '<div class="row-list">' + convos.map(function(c) {
    var preview = (c.last_sender_id === me.id ? 'You: ' : '') + escapeHtml(c.last_message);
    var unread = c.unread_count > 0 ? '<span class="badge">' + c.unread_count + '</span>' : '';
    return '<a class="row round" href="dms.html?with=' + encodeURIComponent(c.username) + '" style="text-decoration:none;color:inherit;">' +
      avatarHtml(c, 40) +
      '<div class="info"><div class="t1">' + escapeHtml(c.display_name) + unread + '</div><div class="t2">' + preview + '</div></div>' +
      '<div class="side" style="color:var(--muted);font-size:11.5px;">' + timeAgo(c.last_message_at) + '</div>' +
    '</a>';
  }).join('') + '</div>';
}

async function startNewConversation() {
  var username = document.getElementById('new-username').value.trim().toLowerCase();
  var body = document.getElementById('new-body').value.trim();
  var errEl = document.getElementById('convo-error');
  errEl.style.display = 'none';
  if (!username || !body) { errEl.textContent = 'Enter a username and a message.'; errEl.style.display = 'block'; return; }

  try {
    var user = (await api('/users/' + username)).user;
    await api('/messages/' + user.id, { method: 'POST', body: { body: body } });
    window.location.href = 'dms.html?with=' + encodeURIComponent(username);
  } catch (err) {
    errEl.textContent = err.message === "That's not a real user" || err.message.indexOf('No profile') !== -1
      ? "Couldn't find that username." : err.message;
    errEl.style.display = 'block';
  }
}

async function renderThread(username) {
  var container = document.getElementById('dm-content');
  var other;
  try {
    other = (await api('/users/' + username)).user;
  } catch (err) {
    container.innerHTML = '<div class="empty-state"><p>Couldn\u2019t find @' + escapeHtml(username) + '.</p></div>';
    return;
  }

  container.innerHTML =
    '<div class="thread-head"><button class="back" id="back-btn">&larr; All conversations</button>' +
    avatarHtml(other, 32) +
    '<div style="font-weight:700;font-size:14px;">' + escapeHtml(other.display_name) + '</div></div>' +
    '<div class="bubbles" id="bubbles"></div>' +
    '<div class="reply-row"><input id="reply-input" placeholder="Message @' + escapeHtml(username) + '">' +
    '<button class="btn btn-grad" id="reply-send">Send</button></div>';

  document.getElementById('back-btn').addEventListener('click', function() { window.location.href = 'dms.html'; });
  document.getElementById('reply-send').addEventListener('click', sendReply);
  document.getElementById('reply-input').addEventListener('keydown', function(e) { if (e.key === 'Enter') sendReply(); });

  var msgs = (await api('/messages/' + other.id)).messages;
  paintBubbles(msgs);
  api('/messages/' + other.id + '/read', { method: 'PATCH' }).catch(function(){});

  async function sendReply() {
    var input = document.getElementById('reply-input');
    var text = input.value.trim();
    if (!text) return;
    input.value = '';
    try {
      await api('/messages/' + other.id, { method: 'POST', body: { body: text } });
      var fresh = (await api('/messages/' + other.id)).messages;
      paintBubbles(fresh);
    } catch (err) {
      alert(err.message);
    }
  }
}

function paintBubbles(msgs) {
  var el = document.getElementById('bubbles');
  el.innerHTML = msgs.map(function(m) {
    var mine = m.sender_id === me.id;
    return '<div class="bubble ' + (mine ? 'mine' : 'theirs') + '">' + escapeHtml(m.body) + '</div>';
  }).join('');
  el.scrollTop = el.scrollHeight;
}

render();
</script>
</body>
</html>
