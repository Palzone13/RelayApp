<!DOCTYPE html>
<html lang="en">
<head>
<script>try{if(localStorage.getItem('relay-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relay — Shorts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #eef1f8;
  --white: #ffffff;
  --pill: #9a9ea8;
  --pill-dark: #82858f;
  --card: #90939c;
  --card-dark: #7c7f88;
  --row: #f3f4f7;
  --line: #e2e4ea;
  --text: #1f2330;
  --muted: #666a76;
  --grad: linear-gradient(90deg,#3b82f6 0%,#8b5cf6 55%,#c026d3 100%);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:inherit;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  min-height:100%;
}
a{color:inherit;text-decoration:none;}

.topbar{
  height:6px;
  width:100%;
  background:var(--grad);
  position:sticky;top:0;z-index:30;
  padding-top:env(safe-area-inset-top,0px);
  background-clip:padding-box;
}

.wrap{max-width:980px;margin:36px auto 60px;padding:0 20px;}

.panel{
  background:var(--white);
  border-radius:22px;
  box-shadow:0 14px 40px rgba(30,41,59,.10);
  padding:30px 32px 34px;
}

.nav-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:26px;}
.search{
  flex:1 1 220px;
  min-width:150px;
  background:var(--row);
  border:1px solid var(--line);
  border-radius:999px;
  padding:12px 44px 12px 18px;
  font-size:13.5px;
  color:var(--muted);
  position:relative;
  display:flex;align-items:center;
}
.search input{border:none;background:none;outline:none;font-size:13.5px;color:var(--text);width:100%;font-family:inherit;}
.search svg{position:absolute;right:16px;width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;}

.pill-nav{display:flex;flex-wrap:wrap;gap:8px;}
.pill{
  background:var(--pill);
  color:#fff;
  border:none;
  border-radius:12px;
  padding:11px 18px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  white-space:nowrap;
  transition:filter .15s, transform .1s;
}
.pill:hover{filter:brightness(.94);}
.pill.active{background:var(--grad);}

.title-pill{
  display:block;
  width:max-content;
  margin:0 auto 26px;
  background:var(--pill);
  color:#fff;
  font-weight:600;
  font-size:13.5px;
  border-radius:12px;
  padding:12px 30px;
  text-align:center;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}
@media (max-width:760px){ .grid{grid-template-columns:repeat(2,1fr);} }
@media (max-width:460px){ .grid{grid-template-columns:1fr;} }

.vcard{
  background:var(--card);
  border-radius:14px;
  aspect-ratio:9/14;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding-top:38%;
  overflow:hidden;
  cursor:pointer;
}
.vcard:hover{background:var(--card-dark);}
.play{
  width:38px;height:38px;border-radius:50%;
  background:#14151a;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:14px;
}
.play svg{width:14px;height:14px;fill:#fff;}
.vcard .label{color:#f2f3f5;font-size:12px;font-weight:500;padding:0 10px;text-align:center;}
.vcard .who{position:absolute;bottom:12px;left:12px;right:12px;color:#fff;font-size:11.5px;opacity:.9;}

.pcard{
  background:var(--card);
  border-radius:14px;
  padding:16px;
  color:#fff;
}
.pcard .head{display:flex;gap:10px;align-items:center;margin-bottom:10px;}
.pcard .avatar{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none;}
.pcard .name{font-size:13px;font-weight:600;}
.pcard .meta{font-size:11px;opacity:.8;}
.pcard .body{font-size:13px;line-height:1.5;opacity:.95;}
.pcard .actions{display:flex;gap:8px;margin-top:14px;}
.pcard .actions button{background:rgba(255,255,255,.18);border:none;border-radius:999px;color:#fff;font-size:11.5px;font-weight:600;padding:6px 12px;cursor:pointer;display:flex;align-items:center;gap:5px;}
.pcard .actions button.on{background:#fff;color:var(--text);}

.row-list{display:flex;flex-direction:column;gap:10px;}
.row{
  background:var(--row);
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px 16px;
  display:flex;align-items:center;gap:12px;
}
.row .avatar{width:40px;height:40px;border-radius:12px;background:var(--card);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;}
.row.round .avatar{border-radius:50%;}
.row .info{min-width:0;flex:1;}
.row .info .t1{font-weight:600;font-size:13.5px;}
.row .info .t2{color:var(--muted);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row .side{flex:none;display:flex;align-items:center;gap:8px;}
.btn{border:none;border-radius:999px;padding:8px 16px;font-size:12.5px;font-weight:600;cursor:pointer;}
.btn-grad{background:var(--grad);color:#fff;}
.btn-flat{background:var(--pill);color:#fff;}
.btn-outline{background:none;border:1px solid var(--line);color:var(--text);}

.section-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 10px;}
.section-title:first-child{margin-top:0;}

.poll{background:var(--row);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px;}
.poll .q{font-weight:700;font-size:14px;margin-bottom:14px;}
.popt{position:relative;border-radius:10px;overflow:hidden;background:#e6e8ee;padding:10px 14px;margin-bottom:8px;cursor:pointer;}
.popt .fill{position:absolute;inset:0;background:var(--grad);opacity:.85;width:0;transition:width .4s;}
.popt.voted .fill{opacity:1;}
.popt .r{position:relative;display:flex;justify-content:space-between;font-size:13px;font-weight:600;}
.popt.voted .r{color:#fff;}

.profile-top{display:flex;gap:18px;align-items:center;margin-bottom:24px;flex-wrap:wrap;}
.profile-top .avatar{width:72px;height:72px;border-radius:20px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;flex:none;}
.profile-top h2{margin:0;font-size:19px;}
.profile-top .handle{color:var(--muted);font-size:13px;margin-top:2px;}
.stats{display:flex;gap:26px;margin-top:12px;}
.stats b{display:block;font-size:16px;}
.stats span{color:var(--muted);font-size:11.5px;}

.toggle{width:38px;height:22px;border-radius:999px;background:var(--pill);position:relative;cursor:pointer;flex:none;}
.toggle.on{background:var(--grad);}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;}
.toggle.on::after{transform:translateX(16px);}

.note{background:#eef2ff;border:1px solid #dbe2fb;color:#3546a3;border-radius:14px;padding:14px 16px;font-size:12.5px;margin-bottom:22px;}
.error{display:none;background:#fdecef;border:1px solid #f6c4cd;color:#b4233c;border-radius:12px;padding:10px 14px;font-size:12.5px;margin-bottom:14px;}
[data-theme="dark"] .error{background:#3a1a22;border-color:#5c2733;color:#ff9db0;}
.upload-form{background:var(--row);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:20px;display:none;}
.upload-form.open{display:block;}
.upload-form input[type="text"]{width:100%;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--text);font-family:inherit;outline:none;margin-bottom:10px;}
.upload-form input[type="file"]{margin-bottom:10px;font-size:12.5px;color:var(--muted);}
.vcard2{
  background:#000;border-radius:14px;aspect-ratio:9/14;position:relative;overflow:hidden;
}
.vcard2 video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.vcard2 .who2{position:absolute;bottom:10px;left:10px;right:10px;color:#fff;font-size:11.5px;text-shadow:0 1px 3px rgba(0,0,0,.6);pointer-events:none;}
.vcard2 .reactrow{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:2;}
.vcard2 .reactrow button{background:rgba(0,0,0,.5);border:none;border-radius:999px;color:#fff;font-size:11px;padding:4px 9px;cursor:pointer;font-weight:600;}
.vcard2 .reactrow button.on{background:var(--grad);}
.empty-state{
  text-align:center;
  padding:60px 20px;
  color:var(--muted);
}
.empty-state p{font-size:15px;font-weight:600;color:var(--text);margin:0 0 6px;}
.empty-state span{font-size:12.5px;}


:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1117; --white:#181b25; --pill:#4b5061; --pill-dark:#3d4252;
  --card:#343948; --card-dark:#2b3040; --row:#212533; --line:#2f3444;
  --text:#eceef4; --muted:#9aa1b3;
}
[data-theme="dark"] .note{background:#1c2240;border-color:#2b3566;color:#b9c4f5;}
[data-theme="dark"] .popt{background:#2a2f3f;}
[data-theme="dark"] .panel{box-shadow:0 14px 40px rgba(0,0,0,.45);}
</style>
</head>
<body>
<script src="api.js"></script>
<script>
api('/auth/me').catch(function(){ window.location.href = 'login.html'; });
</script>
<div class="topbar"></div>
<div class="wrap">
  <div class="panel">
    <div class="nav-row">
      <label class="search">
        <input type="text" placeholder="Search Relay">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </label>
      <a class="pill" href="index.html">Feed</a>
      <a class="pill active" href="reels.html">Shorts</a>
      <a class="pill" href="friends.html">Friends</a>
      <a class="pill" href="dms.html">DMs</a>
      <a class="pill" href="groups.html">Groups</a>
      <a class="pill" href="polls.html">Polls</a>
      <a class="pill" href="profile.html">Profile</a>
      <a class="pill" href="settings.html">Settings</a>
    </div>
    <div class="title-pill">shorts</div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:14px;"><button class="btn btn-grad" id="toggle-form">Upload a short</button></div>

    <div class="upload-form" id="upload-form">
      <input type="file" id="video-file" accept="video/*">
      <input type="text" id="caption-input" placeholder="Caption (optional)">
      <div id="upload-error" class="error"></div>
      <div id="upload-status" style="font-size:12px;color:var(--muted);margin-bottom:8px;"></div>
      <button class="btn btn-grad" id="upload-btn">Post short</button>
    </div>

    <div id="reels-content"><div class="empty-state"><p>Loading&hellip;</p></div></div>
  </div>
</div>

<script>
function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, function(c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
var currentUser = null;

document.getElementById('toggle-form').addEventListener('click', function() {
  document.getElementById('upload-form').classList.toggle('open');
});

function readDuration(file) {
  return new Promise(function(resolve, reject) {
    var url = URL.createObjectURL(file);
    var v = document.createElement('video');
    v.preload = 'metadata';
    v.onloadedmetadata = function() { URL.revokeObjectURL(url); resolve(v.duration); };
    v.onerror = function() { URL.revokeObjectURL(url); reject(new Error("Couldn't read that video file.")); };
    v.src = url;
  });
}

document.getElementById('upload-btn').addEventListener('click', async function() {
  var fileInput = document.getElementById('video-file');
  var file = fileInput.files[0];
  var errEl = document.getElementById('upload-error');
  var statusEl = document.getElementById('upload-status');
  errEl.style.display = 'none';
  statusEl.textContent = '';

  if (!file) { errEl.textContent = 'Choose a video first.'; errEl.style.display = 'block'; return; }

  statusEl.textContent = 'Checking length…';
  var duration;
  try {
    duration = await readDuration(file);
  } catch (err) {
    errEl.textContent = err.message; errEl.style.display = 'block'; statusEl.textContent = ''; return;
  }
  if (duration > 60) {
    errEl.textContent = 'That clip is ' + Math.round(duration) + 's \u2014 shorts have to be 60s or under.';
    errEl.style.display = 'block'; statusEl.textContent = '';
    return;
  }

  var form = new FormData();
  form.append('video', file);
  form.append('durationSec', String(duration));
  form.append('caption', document.getElementById('caption-input').value.trim());

  statusEl.textContent = 'Uploading\u2026';
  document.getElementById('upload-btn').disabled = true;
  try {
    var res = await fetch(API_BASE + '/reels', { method: 'POST', credentials: 'include', body: form });
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Upload failed');
    document.getElementById('video-file').value = '';
    document.getElementById('caption-input').value = '';
    document.getElementById('upload-form').classList.remove('open');
    statusEl.textContent = '';
    loadReels();
  } catch (err) {
    errEl.textContent = err.message; errEl.style.display = 'block'; statusEl.textContent = '';
  } finally {
    document.getElementById('upload-btn').disabled = false;
  }
});

async function loadReels() {
  var container = document.getElementById('reels-content');
  var reels = (await api('/reels')).reels;

  if (reels.length === 0) {
    container.innerHTML = '<div class="empty-state"><p>No shorts yet.</p><span>Reels you or people you follow post will show up here.</span></div>';
    return;
  }

  container.innerHTML = '<div class="grid">' + reels.map(function(r) {
    return '<div class="vcard2" data-reel-id="' + r.id + '">' +
      '<video src="' + API_BASE + r.media_path + '" controls playsinline></video>' +
      '<div class="reactrow">' +
        '<button class="react-btn' + (r.my_reaction === 'like' ? ' on' : '') + '" data-type="like">\u{1F44D} <span>' + r.likes + '</span></button>' +
        '<button class="react-btn' + (r.my_reaction === 'dislike' ? ' on' : '') + '" data-type="dislike">\u{1F44E} <span>' + r.dislikes + '</span></button>' +
      '</div>' +
      '<div class="who2">' + escapeHtml(r.display_name) + (r.caption ? ' \u2014 ' + escapeHtml(r.caption) : '') + '</div>' +
    '</div>';
  }).join('') + '</div>';

  container.querySelectorAll('.react-btn').forEach(function(btn) {
    btn.addEventListener('click', async function() {
      var card = btn.closest('[data-reel-id]');
      try {
        await api('/reels/' + card.dataset.reelId + '/react', { method: 'POST', body: { type: btn.dataset.type } });
        loadReels();
      } catch (err) {
        alert(err.message);
      }
    });
  });
}

api('/auth/me').then(function(r){ currentUser = r.user; loadReels(); });
</script>
</body>
</html>
