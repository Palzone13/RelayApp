<!DOCTYPE html>
<html lang="en">
<head>
<script>try{if(localStorage.getItem('relay-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PalTube — Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #eef1f8;
  --white: #ffffff;
  --pill: #9a9ea8;
  --pill-dark: #82858f;
  --card: #90939c;
  --card-dark: #7c7f88;
  --row: #f3f4f7;
  --line: #e2e4ea;
  --text: #1f2330;
  --muted: #666a76;
  --grad: linear-gradient(90deg,#ef4444 0%,#f97316 100%);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:inherit;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  min-height:100%;
}
a{color:inherit;text-decoration:none;}

.topbar{
  height:6px;
  width:100%;
  background:var(--grad);
  position:sticky;top:0;z-index:30;
  padding-top:env(safe-area-inset-top,0px);
  background-clip:padding-box;
}

.wrap{max-width:980px;margin:36px auto 60px;padding:0 20px;}

.panel{
  background:var(--white);
  border-radius:22px;
  box-shadow:0 14px 40px rgba(30,41,59,.10);
  padding:30px 32px 34px;
}

.nav-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:26px;}
.search{
  flex:1 1 220px;
  min-width:150px;
  background:var(--row);
  border:1px solid var(--line);
  border-radius:999px;
  padding:12px 44px 12px 18px;
  font-size:13.5px;
  color:var(--muted);
  position:relative;
  display:flex;align-items:center;
}
.search input{border:none;background:none;outline:none;font-size:13.5px;color:var(--text);width:100%;font-family:inherit;}
.search svg{position:absolute;right:16px;width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;}

.pill-nav{display:flex;flex-wrap:wrap;gap:8px;}
.pill{
  background:var(--pill);
  color:#fff;
  border:none;
  border-radius:12px;
  padding:11px 18px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  white-space:nowrap;
  transition:filter .15s, transform .1s;
}
.pill:hover{filter:brightness(.94);}
.pill.active{background:var(--grad);}

.title-pill{
  display:block;
  width:max-content;
  margin:0 auto 26px;
  background:var(--pill);
  color:#fff;
  font-weight:600;
  font-size:13.5px;
  border-radius:12px;
  padding:12px 30px;
  text-align:center;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}
@media (max-width:760px){ .grid{grid-template-columns:repeat(2,1fr);} }
@media (max-width:460px){ .grid{grid-template-columns:1fr;} }

.vcard{
  background:var(--card);
  border-radius:14px;
  aspect-ratio:9/14;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding-top:38%;
  overflow:hidden;
  cursor:pointer;
}
.vcard:hover{background:var(--card-dark);}
.play{
  width:38px;height:38px;border-radius:50%;
  background:#14151a;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:14px;
}
.play svg{width:14px;height:14px;fill:#fff;}
.vcard .label{color:#f2f3f5;font-size:12px;font-weight:500;padding:0 10px;text-align:center;}
.vcard .who{position:absolute;bottom:12px;left:12px;right:12px;color:#fff;font-size:11.5px;opacity:.9;}

.pcard{
  background:var(--card);
  border-radius:14px;
  padding:16px;
  color:#fff;
}
.pcard .head{display:flex;gap:10px;align-items:center;margin-bottom:10px;}
.pcard .avatar{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none;}
.pcard .name{font-size:13px;font-weight:600;}
.pcard .meta{font-size:11px;opacity:.8;}
.pcard .body{font-size:13px;line-height:1.5;opacity:.95;}
.pcard .actions{display:flex;gap:8px;margin-top:14px;}
.pcard .actions button{background:rgba(255,255,255,.18);border:none;border-radius:999px;color:#fff;font-size:11.5px;font-weight:600;padding:6px 12px;cursor:pointer;display:flex;align-items:center;gap:5px;}
.pcard .actions button.on{background:#fff;color:var(--text);}

.row-list{display:flex;flex-direction:column;gap:10px;}
.row{
  background:var(--row);
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px 16px;
  display:flex;align-items:center;gap:12px;
}
.row .avatar{width:40px;height:40px;border-radius:12px;background:var(--card);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;}
.row.round .avatar{border-radius:50%;}
.row .info{min-width:0;flex:1;}
.row .info .t1{font-weight:600;font-size:13.5px;}
.row .info .t2{color:var(--muted);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row .side{flex:none;display:flex;align-items:center;gap:8px;}
.btn{border:none;border-radius:999px;padding:8px 16px;font-size:12.5px;font-weight:600;cursor:pointer;}
.btn-grad{background:var(--grad);color:#fff;}
.btn-flat{background:var(--pill);color:#fff;}
.btn-outline{background:none;border:1px solid var(--line);color:var(--text);}

.section-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 10px;}
.section-title:first-child{margin-top:0;}

.poll{background:var(--row);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px;}
.poll .q{font-weight:700;font-size:14px;margin-bottom:14px;}
.popt{position:relative;border-radius:10px;overflow:hidden;background:#e6e8ee;padding:10px 14px;margin-bottom:8px;cursor:pointer;}
.popt .fill{position:absolute;inset:0;background:var(--grad);opacity:.85;width:0;transition:width .4s;}
.popt.voted .fill{opacity:1;}
.popt .r{position:relative;display:flex;justify-content:space-between;font-size:13px;font-weight:600;}
.popt.voted .r{color:#fff;}

.profile-top{display:flex;gap:18px;align-items:center;margin-bottom:24px;flex-wrap:wrap;}
.profile-top .avatar{width:72px;height:72px;border-radius:20px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;flex:none;}
.avatar-wrap{position:relative;flex:none;}
.avatar-wrap img{width:72px;height:72px;border-radius:20px;object-fit:cover;display:block;}
.avatar-edit{position:absolute;inset:0;background:rgba(0,0,0,.5);border-radius:20px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;opacity:0;cursor:pointer;transition:opacity .15s;}
.avatar-wrap:hover .avatar-edit{opacity:1;}
.profile-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.profile-top h2{margin:0;font-size:19px;}
.profile-top .handle{color:var(--muted);font-size:13px;margin-top:2px;}
.stats{display:flex;gap:26px;margin-top:12px;}
.stats .stat-btn{background:none;border:none;padding:0;cursor:pointer;text-align:left;font-family:inherit;}
.stats .stat-btn:hover b{text-decoration:underline;}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modal-backdrop.open{display:flex;}
.modal-box{background:var(--white);border-radius:16px;padding:18px;width:100%;max-width:380px;max-height:70vh;display:flex;flex-direction:column;}
.modal-box .mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.modal-box .mhead h3{margin:0;font-size:15px;}
.modal-box .mclose{background:var(--pill);color:#fff;border:none;border-radius:8px;width:26px;height:26px;cursor:pointer;font-size:14px;}
.modal-box .mlist{overflow-y:auto;display:flex;flex-direction:column;gap:8px;}
.modal-box .mrow{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;padding:6px;border-radius:10px;}
.modal-box .mrow:hover{background:var(--row);}
.modal-box .mrow .mname{font-size:13.3px;font-weight:600;}
.modal-box .mrow .mhandle{font-size:11.5px;color:var(--muted);}
.stats b{display:block;font-size:16px;}
.stats span{color:var(--muted);font-size:11.5px;}

.toggle{width:38px;height:22px;border-radius:999px;background:var(--pill);position:relative;cursor:pointer;flex:none;}
.toggle.on{background:var(--grad);}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;}
.toggle.on::after{transform:translateX(16px);}

.note{background:#eef2ff;border:1px solid #dbe2fb;color:#3546a3;border-radius:14px;padding:14px 16px;font-size:12.5px;margin-bottom:22px;}
.empty-state{
  text-align:center;
  padding:60px 20px;
  color:var(--muted);
}
.empty-state p{font-size:15px;font-weight:600;color:var(--text);margin:0 0 6px;}
.empty-state span{font-size:12.5px;}


:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1117; --white:#181b25; --pill:#4b5061; --pill-dark:#3d4252;
  --card:#343948; --card-dark:#2b3040; --row:#212533; --line:#2f3444;
  --text:#eceef4; --muted:#9aa1b3;
}
[data-theme="dark"] .note{background:#1c2240;border-color:#2b3566;color:#b9c4f5;}
[data-theme="dark"] .popt{background:#2a2f3f;}
[data-theme="dark"] .panel{box-shadow:0 14px 40px rgba(0,0,0,.45);}

.brand-mark{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;color:var(--text);white-space:nowrap;padding:0 4px 0 0;font-family:'Inter',sans-serif;}
.brand-mark .play{width:22px;height:22px;border-radius:7px;background:var(--grad);display:flex;align-items:center;justify-content:center;flex:none;}
.brand-mark .play svg{width:10px;height:10px;fill:#fff;}
</style>
</head>
<body>
<script src="api.js"></script>
<script>
api('/auth/me').catch(function(){ window.location.href = 'login.html'; });
</script>
<div class="topbar"></div>
<div class="wrap">
  <div class="panel">
    <div class="nav-row">
      <div class="brand-mark"><div class="play"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></div>PalTube</div>
      <label class="search">
        <input type="text" placeholder="Search PalTube">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </label>
      <a class="pill" href="index.html">Feed</a>
      <a class="pill" href="reels.html">Shorts</a>
      <a class="pill" href="friends.html">Friends</a>
      <a class="pill" href="dms.html">DMs</a>
      <a class="pill" href="groups.html">Groups</a>
      <a class="pill" href="polls.html">Polls</a>
      <a class="pill active" href="profile.html">Profile</a>
      <a class="pill" href="settings.html">Settings</a>
    </div>
    <div class="title-pill">profile</div>

    <div id="profile-content">
      <div class="empty-state"><p>Loading&hellip;</p></div>
    </div>

  </div>
</div>

<div class="modal-backdrop" id="list-modal">
  <div class="modal-box">
    <div class="mhead"><h3 id="modal-title"></h3><button class="mclose" id="modal-close">&times;</button></div>
    <div class="mlist" id="modal-list"></div>
  </div>
</div>

<script>
function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, function(c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

var params = new URLSearchParams(window.location.search);
var targetUsername = params.get('user'); // null = your own profile

async function loadProfile() {
  var container = document.getElementById('profile-content');
  try {
    var me = (await api('/auth/me')).user;
    var username = targetUsername || me.username;
    var full = await api('/users/' + username);
    var user = full.user, stats = full.stats;

    var avatarBlock = full.isSelf
      ? '<div class="avatar-wrap" id="avatar-wrap">' + avatarHtml(user, 72) +
          '<label class="avatar-edit">Change<input type="file" id="avatar-file" accept="image/*" style="display:none;"></label></div>'
      : avatarHtml(user, 72);

    var actions = '';
    if (!full.isSelf) {
      actions += '<div class="profile-actions">';
      actions += '<button class="btn ' + (full.isFollowing ? 'btn-outline' : 'btn-grad') + '" id="follow-btn">' + (full.isFollowing ? 'Following' : 'Follow') + '</button>';
      if (full.friendStatus === 'friends') {
        actions += '<a class="btn btn-outline" href="dms.html?with=' + encodeURIComponent(user.username) + '" style="text-decoration:none;">Message</a>';
      } else if (full.friendStatus === 'requested') {
        actions += '<button class="btn btn-outline" disabled>Friend request sent</button>';
      } else if (full.friendStatus === 'incoming') {
        actions += '<a class="btn btn-grad" href="friends.html" style="text-decoration:none;">Respond to request</a>';
      } else {
        actions += '<button class="btn btn-outline" id="friend-btn">Add friend</button>';
      }
      actions += '</div>';
    }

    container.innerHTML =
      '<div class="profile-top">' +
        avatarBlock +
        '<div>' +
          '<h2>' + escapeHtml(user.display_name) + '</h2>' +
          '<div class="handle">@' + escapeHtml(user.username) + '</div>' +
          (user.bio ? '<p style="margin:10px 0 0;font-size:13.3px;">' + escapeHtml(user.bio) + '</p>' : '') +
          '<div class="stats">' +
            '<div><b>' + stats.posts + '</b><span>Posts</span></div>' +
            '<button class="stat-btn" data-list="friends"><b>' + stats.friends + '</b><span>Friends</span></button>' +
            '<button class="stat-btn" data-list="followers"><b>' + stats.followers + '</b><span>Followers</span></button>' +
            '<button class="stat-btn" data-list="following"><b>' + stats.following + '</b><span>Following</span></button>' +
          '</div>' +
          actions +
        '</div>' +
      '</div>' +
      '<div class="section-title">Recent posts</div>' +
      '<div id="profile-posts"><div class="empty-state"><p>Loading&hellip;</p></div></div>';

    container.querySelectorAll('.stat-btn').forEach(function(sbtn) {
      sbtn.addEventListener('click', function() {
        openListModal(user.username, sbtn.dataset.list);
      });
    });

    if (full.isSelf) {
      document.getElementById('avatar-file').addEventListener('change', async function() {
        var file = this.files[0];
        if (!file) return;
        var form = new FormData();
        form.append('avatar', file);
        try {
          var res = await fetch(API_BASE + '/users/me/avatar', { method: 'POST', credentials: 'include', body: form });
          var data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Upload failed');
          loadProfile();
        } catch (err) { alert(err.message); }
      });
    }

    if (!full.isSelf) {
      var followBtn = document.getElementById('follow-btn');
      followBtn.addEventListener('click', async function() {
        followBtn.disabled = true;
        try {
          if (full.isFollowing) await api('/follow/' + user.id, { method: 'DELETE' });
          else await api('/follow/' + user.id, { method: 'POST' });
          loadProfile();
        } catch (err) { alert(err.message); followBtn.disabled = false; }
      });
      var friendBtn = document.getElementById('friend-btn');
      if (friendBtn) {
        friendBtn.addEventListener('click', async function() {
          friendBtn.disabled = true;
          try {
            await api('/friends/request/' + user.id, { method: 'POST' });
            loadProfile();
          } catch (err) { alert(err.message); friendBtn.disabled = false; }
        });
      }
    }

    // Posts: only your own feed is fetchable right now, so "recent posts" only populates on your own profile.
    var postsEl = document.getElementById('profile-posts');
    if (!full.isSelf) {
      postsEl.innerHTML = '<div class="empty-state"><p>Posts aren\u2019t viewable here yet.</p><span>Follow or friend them to see their posts in your feed.</span></div>';
      return;
    }

    var feed = await api('/posts/feed');
    var mine = feed.posts.filter(function(p){ return p.user_id === me.id; });

    if (mine.length === 0) {
      postsEl.innerHTML = '<div class="empty-state"><p>No posts yet.</p><span>Posts you make will show up here.</span></div>';
      return;
    }

    postsEl.innerHTML = '<div class="grid">' + mine.map(function(p){
      return '<div class="pcard">' +
        '<div class="head">' + avatarHtml(me, 34) +
        '<div><div class="name">' + escapeHtml(me.display_name) + '</div><div class="meta">' +
        new Date(p.created_at).toLocaleDateString() + '</div></div></div>' +
        (p.body ? '<div class="body">' + escapeHtml(p.body) + '</div>' : '') +
      '</div>';
    }).join('') + '</div>';
  } catch (err) {
    container.innerHTML = '<div class="empty-state"><p>Couldn\u2019t load this profile.</p><span>' + err.message + '</span></div>';
  }
}

loadProfile();

var listLabels = { friends: 'Friends', followers: 'Followers', following: 'Following' };

async function openListModal(username, kind) {
  var modal = document.getElementById('list-modal');
  var listEl = document.getElementById('modal-list');
  document.getElementById('modal-title').textContent = listLabels[kind];
  listEl.innerHTML = '<div style="font-size:12.5px;color:var(--muted);">Loading&hellip;</div>';
  modal.classList.add('open');

  try {
    var data = await api('/users/' + username + '/' + kind);
    var people = data[kind];
    listEl.innerHTML = people.length === 0
      ? '<div style="font-size:12.5px;color:var(--muted);">Nobody here yet.</div>'
      : people.map(function(p) {
          return '<a class="mrow" href="profile.html?user=' + encodeURIComponent(p.username) + '">' +
            avatarHtml(p, 36) +
            '<div><div class="mname">' + escapeHtml(p.display_name) + '</div><div class="mhandle">@' + escapeHtml(p.username) + '</div></div>' +
          '</a>';
        }).join('');
  } catch (err) {
    listEl.innerHTML = '<div style="font-size:12.5px;color:var(--muted);">' + err.message + '</div>';
  }
}

document.getElementById('modal-close').addEventListener('click', function() {
  document.getElementById('list-modal').classList.remove('open');
});
document.getElementById('list-modal').addEventListener('click', function(e) {
  if (e.target.id === 'list-modal') e.currentTarget.classList.remove('open');
});
</script>
</body>
</html>
